spring.application.name=capstone-backend

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/capstone_db?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# 로그인 토큰 (JWT)
# - 로컬은 기본값으로 바로 켜짐, 배포 서버는 꼭 JWT_SECRET 환경변수로 32자 이상 새 값 넣기 (깃허브에 올리지 않기)
odiga.jwt.secret=${JWT_SECRET:odiga-local-only-secret-do-not-deploy-0000}
odiga.jwt.expires-in=3600
