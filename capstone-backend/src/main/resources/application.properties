spring.application.name=capstone-backend

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/capstone_db?serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# DB가 꺼져 있어도 서버는 켜지게 (11/5 예민): 검색·장소·코스는 DB 안 써서 계속 되고, 회원·내 설정만 그동안 에러
# - 시작할 때 DB 연결 안 기다림 + Hibernate가 시작할 때 DB 안 물어봄 (방언은 직접 지정)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA
# - 표 검사(validate)는 시작할 때 DB가 있어야 해서 기본은 끔 (none)
# - 정헌 ERD랑 엔티티 맞는지 볼 때만 로컬에서 DDL_AUTO=validate 로 실행
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# 로그인 토큰 (JWT)
# - 로컬은 기본값으로 바로 켜짐, 배포 서버는 꼭 JWT_SECRET 환경변수로 32자 이상 새 값 넣기 (깃허브에 올리지 않기)
odiga.jwt.secret=${JWT_SECRET:odiga-local-only-secret-do-not-deploy-0000}
odiga.jwt.expires-in=3600

# 혼잡도 파일 (예민 10주차)
# - congestion.tsv = 가짜 유동인구(LG 데이터 모양), congestion_seoul.tsv = 서울시 생활인구
# - 배포 서버는 환경변수 ODIGA_CONGESTION_FILE로 바꿀 수 있음
odiga.congestion-file=${ODIGA_CONGESTION_FILE:congestion.tsv}
# LG 진짜 데이터로 만든 혼잡도·성연령 폴더 (lg/make_lg_data.py --out 폴더, 깃허브에 안 올림)
# - 비워두면 위 가짜 데이터, 넣으면 그 폴더의 congestion_lg.tsv · cell_profile_lg.tsv 읽음
odiga.data-dir=${ODIGA_DATA_DIR:}
